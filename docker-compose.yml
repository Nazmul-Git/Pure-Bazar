services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/purebazar
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file (32+ characters)}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      TRUST_PROXY: 1
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Runs one backup at start, then every 24 hours. Files appear in ./backups
  backup:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    command: ["node", "scripts/backupDb.js", "--loop"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/purebazar
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    user: root
    healthcheck:
      disable: true
    volumes:
      - ./backups:/backups

volumes:
  mongo_data:
  uploads_data:
